name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sync web files into Android assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp sw.js android/app/src/main/assets/
          cp icon-192.png android/app/src/main/assets/
          cp icon-512.png android/app/src/main/assets/

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
          SHL_QA_LLR_v1.0.10.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHL_QA_LLR_Android_v1.0.10
          path: SHL_QA_LLR_v1.0.10.apk
