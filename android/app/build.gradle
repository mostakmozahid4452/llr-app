plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shantaholdings.qa.llr'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shantaholdings.qa.llr'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '1.0.10'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.webkit:webkit:1.12.1'
}
